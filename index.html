<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnóstico de equipo IENN</title>
<meta name="description" content="Encuesta de diagnóstico de equipo para la Inteligencia Colaborativa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Diseño: una columna de lectura para responder y un panel más ancho para el propietario.
   Cintas inclinadas y filetes dorados tomados de la infografía "El escudo de nuestro ADN". */
:root{
  color-scheme:light;
  --font-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --bg:#F3F7FC; --surface:#FFFFFF; --ink:#13213A; --muted:#566379; --line:#D3DEEE;
  --tag-bg:#14224F; --tag-ink:#FFFFFF;
  --fill:#1F4FB5; --fill-ink:#FFFFFF; --soft:#E4EEFB;
  --gold:#C99A2E; --gold-ink:#7C5A0E;
  --bad:#B3261E;
  --r1:#D6E6FA; --r2:#A7C7F2; --r3:#6B9DE3; --r4:#3A6FCC; --r5:#1B469C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#151F36; --ink:#E7ECF4; --muted:#9BA8BE; --line:#27344E;
    --tag-bg:#25397A; --tag-ink:#FFFFFF;
    --fill:#6FA3F5; --fill-ink:#0A1A33; --soft:#1B2A44;
    --gold:#E0B04A; --gold-ink:#E8C06A;
    --bad:#FF8F85;
    --r1:#1F3A66; --r2:#2B5496; --r3:#3B72C4; --r4:#5B93E6; --r5:#9CC2FA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#151F36; --ink:#E7ECF4; --muted:#9BA8BE; --line:#27344E;
  --tag-bg:#25397A; --tag-ink:#FFFFFF;
  --fill:#6FA3F5; --fill-ink:#0A1A33; --soft:#1B2A44;
  --gold:#E0B04A; --gold-ink:#E8C06A;
  --bad:#FF8F85;
  --r1:#1F3A66; --r2:#2B5496; --r3:#3B72C4; --r4:#5B93E6; --r5:#9CC2FA;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);color:var(--ink);
  font:400 16px/1.55 var(--font-body);
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-top:28px}
.wrap.wide{max-width:1040px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Encabezado */
.kicker{font:700 12px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
h1{font-size:clamp(28px,6.2vw,44px);font-weight:800;margin-top:8px;letter-spacing:-.01em}
.rule{height:3px;background:var(--gold);margin:0 0 22px}
.lede{margin-top:16px;color:var(--ink);max-width:62ch}
.lede + .lede{margin-top:8px}
.req{margin-top:14px;font-size:14px;color:var(--muted)}

/* Progreso */
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin-top:22px;border-bottom:1px solid var(--line)}
.progress .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--soft);margin-top:6px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fill);transition:width .25s}

/* Secciones y preguntas */
.sec{margin:44px 0 2px}
.sec-tag{
  display:inline-block;
  background:var(--tag-bg);color:var(--tag-ink);
  font:800 15px var(--font-display);
  padding:9px 34px 9px 18px;
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);
}
.q{padding:22px 0;border-bottom:1px solid var(--line)}
.qt{margin:0 0 14px;font-weight:600;display:block}
.scale{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);max-width:calc(var(--n) * var(--w) + (var(--n) - 1) * var(--gap))}
.ends{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--muted);max-width:calc(var(--n) * var(--w) + (var(--n) - 1) * var(--gap))}
.opt{position:relative;display:block;min-width:0}
.opt input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.opt span{
  display:grid;place-items:center;height:44px;
  border:1.5px solid var(--line);border-radius:999px;background:var(--surface);
  font:700 15px var(--font-display);color:var(--ink);transition:background .12s,border-color .12s,color .12s;
}
.opt:hover span{border-color:var(--fill)}
.opt input:checked + span{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.opt input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.sl{position:relative;max-width:var(--mw)}
.sl-in{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}
.sl-hit{-webkit-tap-highlight-color:transparent;padding:8px 0 0;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sl-rail{position:relative;height:8px;margin:14px 16px 0;border-radius:999px;background:var(--line)}
.sl-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--fill);transition:width .12s}
.sl-tick{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--surface);transform:translate(-50%,-50%);opacity:.9}
.sl-thumb{position:absolute;top:50%;left:0;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);
  background:var(--surface);border:2px dashed var(--fill);opacity:.7;transition:left .12s,background .12s,opacity .12s;box-shadow:0 1px 3px rgba(10,30,70,.15)}
.sl.has .sl-thumb{background:var(--fill);border:3px solid var(--surface);opacity:1;box-shadow:0 0 0 2px var(--fill),0 3px 8px rgba(10,30,70,.25)}
.sl-hit:hover .sl-thumb{opacity:1}
.sl-nums{position:relative;height:30px;margin:12px 16px 0}
.sl-nums span{position:absolute;top:0;transform:translateX(-50%);font:700 15px var(--font-display);color:var(--muted);transition:color .12s}
.sl-nums span.on{color:var(--fill);font-size:17px}
.sl-in:focus-visible ~ .sl-hit .sl-thumb{outline:3px solid var(--gold);outline-offset:3px}
.sl-ends{display:flex;justify-content:space-between;gap:12px;margin-top:2px;font-size:13px;color:var(--muted);max-width:var(--mw)}
/* Comparación con la encuesta anterior */
.sw-toggle{appearance:none;display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--font-body);padding:7px 14px 7px 10px;border-radius:999px;cursor:pointer}
.sw-toggle:hover{border-color:var(--fill)}
.sw-toggle:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sw-toggle .trk{position:relative;flex:none;width:34px;height:20px;border-radius:999px;background:var(--line);transition:background .15s}
.sw-toggle .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(10,30,70,.3);transition:transform .15s}
.sw-toggle[aria-checked="true"] .trk{background:var(--fill)}
.sw-toggle[aria-checked="true"] .trk::after{transform:translateX(14px)}
.dl{display:inline-block;white-space:nowrap;padding:2px 9px;border-radius:999px;font:700 12px var(--font-display);font-variant-numeric:tabular-nums;border:1.5px solid currentColor}
.dl.up{color:var(--fill)}
.dl.down{color:var(--bad)}
.dl.same{color:var(--muted)}
.cline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.mprev{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.acc-prev{font:600 13px var(--font-body);color:var(--muted)}
.ctiles{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 6px}
.ctile{flex:1 1 150px;max-width:240px;padding:14px 16px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
.ctile b{display:block;font:800 34px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.ctile span{font:700 11px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.ctile.up b,.ctile.up span{color:var(--fill)}
.ctile.down b,.ctile.down span{color:var(--bad)}
.ctile.same b,.ctile.same span{color:var(--muted)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.crow p{font-weight:600;font-size:15px}
.crow small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.crow .ba{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;font:700 15px var(--font-display);font-variant-numeric:tabular-nums}
.crow .ba i{font-style:normal;color:var(--muted);font-weight:600}
details.more{margin-top:14px}
details.more > summary{cursor:pointer;font:700 15px var(--font-display);padding:6px 0}
.cmpnps{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;max-width:70ch}
.cmpnps .dl{margin-left:6px}
/* eNPS frente a otras empresas */
.bench{margin-top:20px;max-width:860px}
.brow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 64px;gap:4px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .nm{font-size:14px;font-weight:600;min-width:0}
.brow .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.brow .v{white-space:nowrap;font:800 16px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.btrack{position:relative;height:16px;background:var(--soft);border-radius:2px;overflow:hidden}
.btrack .zero{position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.7}
.btrack .bar{position:absolute;top:3px;bottom:3px;background:var(--muted);opacity:.55;border-radius:1px}
.btrack .bar.range{opacity:.6;border:1.5px solid var(--muted);background:transparent}
.brow.me .nm,.brow.me .v{color:var(--fill)}
.brow.me .btrack .bar{background:var(--fill);opacity:1}
.brow.me.old .btrack .bar{opacity:.45}
.bands{display:flex;margin-top:14px;margin-left:244px;margin-right:78px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bands span{display:block;text-align:center;border-top:2px solid var(--line);padding-top:4px;overflow:hidden;white-space:nowrap}
@media (max-width:620px){.brow{grid-template-columns:minmax(0,1fr) 78px}.brow .btrack{grid-column:1 / -1;order:3}.bands{margin-left:0;margin-right:0}}
.srcs{margin-top:16px;font-size:13px;color:var(--muted);max-width:78ch}
.srcs a{color:var(--ink);text-underline-offset:2px}
.npshd{margin-top:26px}
.q.missing{border-left:4px solid var(--bad);padding-left:14px;margin-left:-18px}
.miss{color:var(--bad);font-size:14px;font-weight:700;margin-top:10px}
.ta{width:100%;min-height:120px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.opcional{font-weight:400;color:var(--muted);font-size:14px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative;display:block}
.choice input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.choice span{display:block;padding:11px 20px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font:700 15px var(--font-display);color:var(--ink);transition:background .12s,border-color .12s,color .12s}
.choice:hover span{border-color:var(--fill)}
.choice input:checked + span{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.choice input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.hint{margin:-6px 0 12px;font-size:13px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 90px;gap:0 12px;margin-top:14px;max-width:760px}
.cmp > *{padding:10px 0;border-top:1px solid var(--line)}
.cmp .hd{font:700 11px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0;text-align:right}
.cmp .hd:first-child{text-align:left}
.cmp .num{font:800 18px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.cmp .diff{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.cmp .diff.gap{color:var(--gold-ink)}

/* Botones y avisos */
.btn{appearance:none;border:0;background:var(--tag-bg);color:var(--tag-ink);font:700 15px var(--font-display);padding:14px 26px;border-radius:4px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:9px 16px;font-size:13px}
.btn.ghost:hover{border-color:var(--fill)}
.send{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:30px}
.status{font-size:14px;font-weight:700;color:var(--bad)}
.thanks{padding:64px 0 0}
.keyform{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;max-width:440px}
.keyin{flex:1;min-width:200px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.thanks svg{color:var(--fill)}
.thanks h1{margin-top:16px}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer}
.note{margin-top:16px;padding:10px 14px;border:1.5px solid var(--gold);font-size:14px}
.sig{margin-top:64px;padding:12px 0;font-size:12px;color:var(--muted);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* Panel */
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.dh-side{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--soft);font-size:13px;font-weight:700;border-radius:999px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--fill)}
.live.on::before{animation:pulse 1.8s ease-out infinite}
.live.off::before{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fill) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion: reduce){.live.on::before{animation:none}.bar i,.opt span{transition:none}}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 48px;padding:8px 0 4px}
.count{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.count b{font:800 clamp(72px,16vw,128px)/0.9 var(--font-display);color:var(--fill);font-variant-numeric:tabular-nums}
.count span{font:700 20px/1.25 var(--font-display);max-width:11ch}
.since{margin-top:10px;color:var(--muted);font-size:14px}
.minis{display:flex;gap:36px;flex-wrap:wrap}
.mini small{display:block;font:700 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini b{font:800 34px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.mini em{font-style:normal;font-size:14px;color:var(--muted);margin-left:4px}
.sdnote{display:table;margin-top:2px;font-size:12px;font-weight:400;color:var(--muted)}
.empty{margin-top:28px;padding:28px 0;border-top:2px solid var(--gold);max-width:56ch}
.empty h2{font-size:22px;margin-bottom:8px}
.block{border-top:2px solid var(--gold);margin-top:44px;padding-top:18px}
.block h2{font-size:22px;font-weight:800}
.block h3.mt{font-size:15px;font-weight:800;margin-bottom:4px}
.block .sub{color:var(--muted);font-size:14px;margin-top:4px;max-width:70ch}

/* Resumen general */
.sum{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 28px;margin:14px 0 0;max-width:900px}
.sum dt{font:700 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);padding:14px 0;border-top:1px solid var(--line)}
.sum dd{margin:0;padding:12px 0;border-top:1px solid var(--line)}
.sum dt:first-of-type,.sum dd:first-of-type{border-top:0}

/* Dimensiones y niveles */
.dim,.axis{display:grid;grid-template-columns:230px minmax(0,1fr) 56px;gap:4px 16px;align-items:center}
.dim{padding:10px 0}
.dim .nm{font-weight:700}
.chip{display:inline-block;margin-top:3px;padding:2px 9px;border:1.5px solid currentColor;border-radius:999px;font:700 10.5px var(--font-display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.chip.lo{color:var(--bad)}
.chip.mid{color:var(--gold-ink)}
.chip.hi{color:var(--fill)}
.dim .nm .chip{display:table}
.track{position:relative;height:16px;background:var(--soft);border-radius:2px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--fill)}
.track i.lo{background:var(--bad)}
.track i.mid{background:var(--gold)}
.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--bg) calc(25% - 1px) 25%)}
.val{font:800 20px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.axis{margin-top:2px}
.ticks{position:relative;height:18px;font-size:12px;color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px;margin-top:30px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.mrow p{font-weight:600;font-size:15px}
.mrow small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.mrow b{font:800 18px var(--font-display);font-variant-numeric:tabular-nums}

/* Detalle */
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 13px var(--font-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tag-bg);color:var(--tag-ink)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend .sw{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:10px;display:inline-block;border-radius:1px}
.grp{margin-top:26px}
.grp h3{display:inline-block;background:var(--tag-bg);color:var(--tag-ink);font-size:14px;font-weight:800;padding:7px 30px 7px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px 28px;padding:20px 0;border-bottom:1px solid var(--soft);align-items:center}
.qrow .qt{margin:0;font-weight:600;font-size:15px}
.qrow .dimtag{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.avgline{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.avgline b{font:800 20px var(--font-display);font-variant-numeric:tabular-nums}
.avgline span{font-size:13px;color:var(--muted)}
.avgline .fav{margin-left:auto}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:10px;font-size:12px;color:var(--muted)}
.cnt b{display:block;font:800 18px/1.1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.cnt .zero{opacity:.45}
.k-lo{background:var(--gold)}.k-mi{background:var(--line)}.k-hi{background:var(--fill)}
.acc{margin-top:18px;border-top:2px solid var(--gold)}
.acc summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 0;list-style:none;cursor:pointer;font:800 17px var(--font-display)}
.acc summary::-webkit-details-marker{display:none}
.acc summary{position:relative;padding-right:26px}
.acc summary::after{content:"";position:absolute;right:6px;top:24px;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-135deg) translate(-2px,-2px)}
.acc:not([open]) summary::after{transform:rotate(45deg) translate(-2px,-2px)}
.acc-name{flex:1 1 auto;min-width:0}
.acc-avg{font:600 13px var(--font-body);color:var(--muted)}
.acc-body{padding-bottom:6px}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.dist i{display:block;min-width:0}
.c1{background:var(--r1)}.c2{background:var(--r2)}.c3{background:var(--r3)}.c4{background:var(--r4)}.c5{background:var(--r5)}

/* NPS */
.npsgrid{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:28px 48px;margin-top:20px;align-items:start}
.npsnum b{display:block;font:800 clamp(56px,11vw,88px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.npsnum span{color:var(--muted);font-size:14px}
.split{display:flex;height:18px;border-radius:2px;overflow:hidden;background:var(--soft);margin-top:6px}
.split i{display:block}
.k-det{background:var(--bad)}.k-pas{background:var(--gold)}.k-pro{background:var(--fill)}
.splitlbl{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13px;color:var(--muted)}
.splitlbl i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:1px}
.hist{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-items:end;height:118px;margin-top:22px}
.hcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hcol u{text-decoration:none;display:block;width:100%;border-radius:2px 2px 0 0;min-height:2px}
.hcol b{font-weight:700;color:var(--ink)}

.cm{padding:14px 0;border-top:1px solid var(--line);max-width:70ch}
.cm p{white-space:pre-wrap;overflow-wrap:anywhere}
.cm small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.foot{margin-top:48px;font-size:13px;color:var(--muted);max-width:70ch}

@media (max-width:720px){
  .dim,.axis{grid-template-columns:minmax(0,1fr) auto}
  .dim .track{grid-column:1 / -1;order:3}
  .axis .sp{display:none}
  .ticks{grid-column:1 / -1}
  .qrow{grid-template-columns:minmax(0,1fr)}
  .npsgrid{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .sum{grid-template-columns:minmax(0,1fr)}
  .sum dt{padding-bottom:0}
  .sum dd{border-top:0;padding-top:2px}
  .q.missing{margin-left:0}
  .cmp{grid-template-columns:minmax(0,1fr) 72px 72px 60px;gap:0 8px}
}
</style>

<body>
<div id="app"><div class="wrap"><p class="kicker">Diagnóstico de equipo IENN</p><p class="lede">Preparando la página…</p></div></div>

<script>
(function(){
"use strict";

var app = document.getElementById("app");

var DIMS = ["Confianza","Resolución de problemas","Compromiso","Responsabilidades","Resultados"];
var LIKERT = [
  "Los miembros del equipo admiten sus errores y debilidades de forma abierta.",
  "Los miembros del equipo se piden ayuda unos a otros sin dudarlo.",
  "Los miembros del equipo se disculpan entre sí cuando actúan de forma inapropiada.",
  "Los miembros del equipo sienten la confianza de decir “no” o “ahora no” a una nueva solicitud si ya están al máximo de su capacidad.",
  "Los miembros del equipo están dispuestos a admitir que otros tienen mejores habilidades.",
  "Las reuniones son apasionantes y nada aburridas.",
  "Durante las reuniones, se sacan a relucir los temas más difíciles para resolverlos.",
  "Los miembros del equipo expresan sus opiniones aunque sean contrarias a las de los demás.",
  "Los miembros del equipo mantienen un trato respetuoso incluso durante discusiones acaloradas.",
  "Se incentiva a los miembros a cuestionar el “status quo” de los procesos actuales.",
  "Los miembros del equipo salen de las reuniones confiando en que todos aceptaron las decisiones.",
  "El equipo termina las reuniones con directrices y metas claras.",
  "Se apoya la decisión final del grupo, incluso si hubo desacuerdos iniciales.",
  "Incluso con incertidumbre, el equipo toma acciones concretas en lugar de paralizarse.",
  "Las prioridades del equipo están claras para todos en todo momento.",
  "Los miembros del equipo se llaman la atención sobre conductas improductivas.",
  "El equipo presiona a los miembros que rinden poco para que mejoren.",
  "Todos se sienten responsables de los resultados, inclusive cuando son mediocres.",
  "Los miembros prefieren confrontar a un compañero antes que acudir al líder.",
  "El equipo revisa periódicamente su progreso respecto a los estándares establecidos.",
  "Los miembros sacrifican voluntariamente su reconocimiento por el bien del equipo.",
  "El equipo se enfoca en el éxito colectivo más que en objetivos individuales.",
  "Se sienten profundamente afectados cuando el equipo no logra sus metas.",
  "Manejamos correctamente la flexibilidad y respetamos los límites sanos.",
  "Se celebran los hitos del equipo con entusiasmo por parte de todos."
];
var NPS_Q = "¿Qué tan probable es que recomiendes tu puesto de trabajo a un amigo o colega?";
var OPEN_Q = "¿Hay algo que le quieras regalar al equipo para mejorar? ¿Cómo crees que afecta esto al equipo?";
var N = 26;
var DONE_KEY = "ienn-diagnostico-enviado";
var TOKEN_KEY = "ienn-diagnostico-token";
var KEY_KEY = "ienn-diagnostico-clave";
/* Dirección del script de Google que guarda las respuestas en la hoja. */
var API_URL = "https://script.google.com/macros/s/AKfycbzzbxIcQk-PEFE_DMzz9Hv7tbnjRJE3F0yiI8cSZ6XzWQ-L-1g2cx2Wz-N6DKeTmH9BiQ/exec";
/* Código del equipo: viene en el enlace de la encuesta (?c=...). */
var TEAM_CODE = "xpzc8vuva7"; /* código por defecto: los enlaces viejos sin ?c= también funcionan */
try { TEAM_CODE = new URLSearchParams(location.search).get("c") || TEAM_CODE; } catch(e){}
var LEVELS = { lo:"Prioridad alta", mid:"Por mejorar", hi:"Fortaleza" };

var ctx = { key:"" };
var S = { mode:"loading", stats:null, order:"survey", loaded:false, err:"", poll:null, compare:false };
/* ---------- Encuesta anterior (datos del informe en PDF) ---------- */
var PREV = {
  label:"Encuesta anterior", n:22,
  /* promedio de cada afirmación, en el mismo orden de LIKERT (un decimal, como en el informe) */
  avg:[3.5,3.7,3.4,2.9,3.9,  3.2,3.7,3.4,3.7,3.9,  3.3,3.5,3.5,4.3,3.0,  3.0,3.7,3.7,3.3,3.5,  3.7,4.1,4.0,3.0,4.1],
  /* recomendación: personas que eligieron 1, 2, … 10 */
  npsDist:[0,0,2,3,1,3,0,4,3,6]
};
PREV.dimAvg = DIMS.map(function(_, d){ var t = 0; for (var q = d*5; q < d*5+5; q++) t += PREV.avg[q]; return t / 5; });
PREV.overall = PREV.dimAvg.reduce(function(a, b){ return a + b; }, 0) / 5;
PREV.det = 0; for (var pi = 0; pi < 6; pi++) PREV.det += PREV.npsDist[pi];
PREV.pas = PREV.npsDist[6] + PREV.npsDist[7];
PREV.pro = PREV.npsDist[8] + PREV.npsDist[9];
PREV.nps = Math.round((PREV.pro - PREV.det) / PREV.n * 100);
var CMP_KEY = "ienn-comparar";
var STABLE = 0.3;      /* menos de esto se considera que "se mantiene" */
var STABLE_NPS = 10;   /* puntos de NPS */
function getCompare(){ try { var v = localStorage.getItem(CMP_KEY); return v === "1"; } catch(e){ return false; } }
function setCompare(on){ S.compare = on; try { localStorage.setItem(CMP_KEY, on ? "1" : "0"); } catch(e){} }
S.compare = getCompare();
function r1(d){ return Math.round(d * 10) / 10; }
function sgn(d, dec){ var a = Math.abs(d); var t = dec === 0 ? String(Math.round(a)) : f1(a); return (d > 0 ? "+" : d < 0 ? "−" : "") + t; }
function trendOf(d, thr){ return d >= thr ? "up" : d <= -thr ? "down" : "same"; }
function dchip(d, thr, dec){
  var t = trendOf(d, thr);
  return h("span", { class:"dl " + t, title: t === "up" ? "Mejoró" : t === "down" ? "Empeoró" : "Se mantiene", text:(t === "up" ? "▲ " : t === "down" ? "▼ " : "● ") + sgn(d, dec) });
}
function dchipAvg(now, before){ return dchip(r1(now - before), STABLE); }


/* ---------- utilidades ---------- */
function h(tag, attrs){
  var el = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, kid){
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ append(el, k); }); return; }
  el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function svg(markup, cls){ var s = h("span", { class: cls || "", "aria-hidden":"true" }); s.innerHTML = markup; return s; }
var ICON_LOCK = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
var ICON_OK = '<svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
function mount(node){ app.replaceChildren(node); }
function f1(n){ return n.toLocaleString("es", { minimumFractionDigits:1, maximumFractionDigits:1 }); }
function pct(n){ return Math.round(n * 100) + " %"; }
function plural(n, one, many){ return n === 1 ? one : many; }
function level(v){ return v < 3 ? "lo" : v < 4 ? "mid" : "hi"; }
function fsd(v){ return v === null ? "—" : "± " + f1(v); }
function spread(v){ return v === null ? "" : v < 0.5 ? "respuestas parecidas" : v < 0.8 ? "opiniones variadas" : "equipo dividido"; }
function ago(ms){
  if (!ms) return "";
  var s = (Date.now() - ms) / 1000;
  if (s < 45) return "hace unos segundos";
  var m = Math.round(s / 60);
  if (m < 60) return "hace " + m + " min";
  var hh = Math.round(m / 60);
  if (hh < 24) return "hace " + hh + " h";
  var d = Math.round(hh / 24);
  return "hace " + d + " " + plural(d, "día", "días");
}
function reduced(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

/* Marca aleatoria del navegador: evita que la misma persona envíe dos veces. No identifica a nadie. */
function getToken(){
  var t = "";
  try { t = localStorage.getItem(TOKEN_KEY) || ""; } catch(e){}
  if (!t) {
    var a = new Uint8Array(16);
    window.crypto.getRandomValues(a);
    t = Array.prototype.map.call(a, function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
    try { localStorage.setItem(TOKEN_KEY, t); } catch(e){}
  }
  return t;
}
function callApi(payload){
  return fetch(API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) }).then(function(r){ return r.json(); });
}

/* Entrada discreta al panel: 5 toques seguidos en el texto pequeño del pie.
   Pide la clave del panel; sin ella no se ve ningún resultado. */
function signature(){
  var taps = 0, t0 = 0;
  return h("div", { class:"sig", onclick:function(){
    var now = Date.now();
    if (now - t0 > 3000) taps = 0;
    if (taps === 0) t0 = now;
    taps++;
    if (taps >= 5) { taps = 0; openPanel(); }
  }, text:"Diagnóstico de equipo IENN · Inteligencia Colaborativa" });
}

/* ---------- encuesta ---------- */
function scaleQ(idx, text, max, endA, endB){
  var id = "q" + idx;
  var mw = max === 10 ? 480 : 420;
  var vars = "--mw:" + mw + "px";
  function pct(v){ return ((v - 1) / (max - 1) * 100) + "%"; }
  var radios = [], ticks = [], nums = [];
  for (var v = 1; v <= max; v++) {
    radios.push(h("input", { type:"radio", name:id, value:String(v), class:"sl-in", "aria-label":String(v) }));
    var t = h("i", { class:"sl-tick" }); t.style.left = pct(v); ticks.push(t);
    var n = h("span", { text:String(v) }); n.style.left = pct(v); nums.push(n);
  }
  var fill = h("div", { class:"sl-fill" });
  var thumb = h("div", { class:"sl-thumb" });
  var rail = h("div", { class:"sl-rail" }, fill, ticks, thumb);
  var numsRow = h("div", { class:"sl-nums" }, nums);
  var hit = h("div", { class:"sl-hit" }, rail, numsRow);
  var sl = h("div", { class:"sl", style:vars }, radios, hit);

  function current(){ for (var i = 0; i < radios.length; i++) if (radios[i].checked) return i + 1; return 0; }
  function render(){
    var c = current();
    sl.classList.toggle("has", c > 0);
    var p = c > 0 ? pct(c) : "0%";
    thumb.style.left = p; fill.style.width = c > 0 ? p : "0%";
    for (var i = 0; i < nums.length; i++) nums[i].classList.toggle("on", i + 1 === c);
  }
  function setVal(v){
    if (v < 1 || v > max || current() === v) return;
    radios[v - 1].checked = true;
    radios[v - 1].dispatchEvent(new Event("change", { bubbles:true }));
  }
  function fromEvent(e){
    var r = rail.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    return Math.round(ratio * (max - 1)) + 1;
  }
  var down = false;
  hit.addEventListener("pointerdown", function(e){
    down = true;
    try { hit.setPointerCapture(e.pointerId); } catch(x){}
    if (e.pointerType === "mouse") setVal(fromEvent(e));
  });
  hit.addEventListener("pointermove", function(e){ if (down) setVal(fromEvent(e)); });
  hit.addEventListener("pointerup", function(e){ if (down) { setVal(fromEvent(e)); } down = false; });
  hit.addEventListener("pointercancel", function(){ down = false; });
  sl.addEventListener("change", render);

  return h("div", { class:"q", id:"c" + id, role:"radiogroup", "aria-labelledby":"l" + id },
    h("p", { class:"qt", id:"l" + id, text:text }),
    sl,
    h("div", { class:"sl-ends", style:vars }, h("span", { text:endA }), h("span", { text:endB })),
    h("p", { class:"miss", text:"Falta responder esta pregunta.", hidden:true })
  );
}

function tenureQ(){
  var opts = [["si","Sí"],["no","No"],["na","Prefiero no decirlo"]].map(function(o){
    return h("label", { class:"choice" }, h("input", { type:"radio", name:"tn", value:o[0] }), h("span", { text:o[1] }));
  });
  return h("div", { class:"q", id:"ctn", role:"radiogroup", "aria-labelledby":"ltn" },
    h("p", { class:"qt", id:"ltn", text:"¿Tienes más de 3 meses en el equipo?" }),
    h("p", { class:"hint", text:"Se usa solo para comparar grupos. Nunca se muestra por persona." }),
    h("div", { class:"choices" }, opts),
    h("p", { class:"miss", text:"Falta responder esta pregunta.", hidden:true })
  );
}

function surveyView(){
  var form = h("form", { id:"survey", novalidate:true });
  var progText = h("span", { id:"prog-text" });
  var barFill = h("i");
  var status = h("p", { class:"status", role:"alert" });
  var send = h("button", { class:"btn", type:"submit", id:"send-btn", text:"Enviar respuestas" });

  function section(title){ return h("div", { class:"sec" }, h("h2", { class:"sec-tag", text:title })); }
  form.append(section("Antes de empezar"));
  form.append(tenureQ());
  for (var d = 0; d < DIMS.length; d++) {
    form.append(section(DIMS[d]));
    for (var j = 0; j < 5; j++) form.append(scaleQ(d*5 + j + 1, LIKERT[d*5 + j], 5, "Nunca", "Siempre"));
  }
  form.append(section("Para cerrar"));
  form.append(scaleQ(26, NPS_Q, 10, "No lo haría", "Lo haría sin dudarlo"));
  form.append(h("div", { class:"q" },
    h("label", { class:"qt", for:"q27" }, OPEN_Q, " ", h("span", { class:"opcional", text:"(opcional)" })),
    h("textarea", { class:"ta", id:"q27", name:"q27", maxlength:"1000", rows:"4" })
  ));
  form.append(h("div", { class:"send" }, send, status));

  function answered(){
    var c = form.querySelector('input[name="tn"]:checked') ? 1 : 0;
    for (var i = 1; i <= N; i++) if (form.querySelector('input[name="q' + i + '"]:checked')) c++;
    return c;
  }
  function updateProgress(){
    var c = answered(), total = N + 1;
    progText.textContent = c + " de " + total + " respondidas";
    barFill.style.width = (c / total * 100) + "%";
  }
  form.addEventListener("change", function(e){
    updateProgress();
    var box = e.target.closest && e.target.closest(".q");
    if (box && box.classList.contains("missing")) {
      box.classList.remove("missing");
      var m = box.querySelector(".miss"); if (m) m.hidden = true;
    }
    status.textContent = "";
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var a = [], firstMissing = null, missing = 0;
    var tnChk = form.querySelector('input[name="tn"]:checked');
    if (!tnChk) {
      var tb = document.getElementById("ctn");
      missing++; tb.classList.add("missing"); tb.querySelector(".miss").hidden = false; firstMissing = tb;
    }
    for (var i = 1; i <= N; i++) {
      var box = document.getElementById("cq" + i);
      var chk = form.querySelector('input[name="q' + i + '"]:checked');
      if (!chk) {
        missing++; box.classList.add("missing"); box.querySelector(".miss").hidden = false;
        if (!firstMissing) firstMissing = box;
      } else a.push(parseInt(chk.value, 10));
    }
    if (missing) {
      status.textContent = "Faltan " + missing + " " + plural(missing, "pregunta", "preguntas") + " por responder.";
      firstMissing.scrollIntoView({ block:"center", behavior: reduced() ? "auto" : "smooth" });
      return;
    }
    if (!API_URL) {
      status.textContent = "La encuesta todavía no está conectada a su hoja de resultados. Avisa a quien te la compartió.";
      return;
    }
    send.disabled = true; send.textContent = "Enviando…"; status.textContent = "";
    var text = (document.getElementById("q27").value || "").trim().slice(0, 1000);
    callApi({ action:"submit", code:TEAM_CODE, token:getToken(), a:a, t:text, tn:tnChk.value }).then(function(res){
      if (res && (res.ok || res.error === "duplicate")) {
        try { localStorage.setItem(DONE_KEY, "1"); } catch(err){}
        showThanks();
        return;
      }
      send.disabled = false; send.textContent = "Enviar respuestas";
      var er = res && res.error;
      status.textContent = er === "code" ? "Este enlace no es válido. Pide a quien organiza la encuesta que te lo envíe de nuevo."
        : er === "busy" ? "Hay muchas personas enviando a la vez. Espera unos segundos y vuelve a intentarlo."
        : "No se pudo guardar tu respuesta. Vuelve a intentarlo.";
    }, function(){
      send.disabled = false; send.textContent = "Enviar respuestas";
      status.textContent = "No se pudo enviar. Revisa tu conexión y vuelve a intentarlo.";
    });
  });

  var node = h("div", { class:"wrap" },
    h("p", { class:"kicker", text:"Inteligencia Colaborativa" }),
    h("h1", { text:"Diagnóstico de equipo IENN" }),
    h("div", { class:"rule", style:"margin-top:18px;max-width:120px" }),
    h("p", { class:"lede", text:"Esta encuesta tiene como objetivo hacer un diagnóstico de equipo para seguir trabajando hacia la Inteligencia Colaborativa." }),
    h("p", { class:"lede", text:"Tus respuestas son anónimas y fundamentales para mejorar nuestro sistema. ¡Agradecemos tu tiempo y sinceridad!" }),
    h("p", { class:"req", text:"Todas las preguntas son obligatorias, excepto la última. Mueve la bolita en cada barra: 1 significa “Nunca” y 5 significa “Siempre”. Solo puedes enviar la encuesta una vez." }),
    h("div", { class:"progress" }, h("div", { class:"row" }, progText, h("span", { text:"Mueve la bolita en cada pregunta" })), h("div", { class:"bar" }, barFill)),
    form,
    signature()
  );
  updateProgress();
  return node;
}

function showThanks(){
  S.mode = "thanks";
  mount(h("div", { class:"wrap thanks" },
    svg(ICON_OK),
    h("h1", { text:"Gracias por tu sinceridad" }),
    h("p", { class:"lede", text:"Tu respuesta quedó registrada. Los resultados se muestran sin nombres." }),
    h("p", { class:"req", text:"Cada persona responde una sola vez, así que no se puede enviar otra." }),
    signature()
  ));
  window.scrollTo(0,0);
}

function showSurvey(){
  var done = false;
  try { done = localStorage.getItem(DONE_KEY) === "1"; } catch(e){}
  if (done) { showThanks(); return; }
  S.mode = "survey";
  mount(surveyView());
}

/* ---------- análisis ---------- */
function computeStats(docs){
  var rows = [];
  docs.forEach(function(d){
    var x = d.data();
    if (!x || !Array.isArray(x.a) || x.a.length !== N) return;
    for (var i = 0; i < N; i++) {
      var v = x.a[i], max = i === 25 ? 10 : 5;
      if (typeof v !== "number" || Math.floor(v) !== v || v < 1 || v > max) return;
    }
    rows.push({ a:x.a, t: typeof x.t === "string" ? x.t.trim().slice(0,1000) : "", tn: (x.tn === "si" || x.tn === "no") ? x.tn : "na", at: typeof x.at === "string" ? Date.parse(x.at) || 0 : 0 });
  });
  var n = rows.length;
  var dist = [];
  for (var i = 0; i < N; i++) { var z = []; for (var k = 0; k < (i === 25 ? 10 : 5); k++) z.push(0); dist.push(z); }
  rows.forEach(function(r){ r.a.forEach(function(v, i){ dist[i][v-1]++; }); });
  var avg = dist.map(function(c){ var s = 0; c.forEach(function(q, j){ s += q * (j+1); }); return n ? s / n : 0; });
  var dimAvg = DIMS.map(function(_, d){ var s = 0; for (var q = d*5; q < d*5+5; q++) s += avg[q]; return n ? s / 5 : 0; });
  var overall = n ? dimAvg.reduce(function(a,b){ return a+b; }, 0) / 5 : 0;
  var favCount = 0; for (var f = 0; f < 25; f++) favCount += dist[f][3] + dist[f][4];
  var favAll = n ? favCount / (25 * n) : 0;
  var c = dist[25];
  var det = 0; for (var a = 0; a < 6; a++) det += c[a];
  var pas = c[6] + c[7], pro = c[8] + c[9];
  var nps = n ? Math.round((pro - det) / n * 100) : 0;
  var texts = rows.filter(function(r){ return r.t; }).sort(function(p, q){ return q.at - p.at; });
  var last = 0; rows.forEach(function(r){ if (r.at > last) last = r.at; });
  function agg(list){
    var m = list.length, sums = [0,0,0,0,0], p = 0, dt = 0;
    list.forEach(function(r){
      for (var q = 0; q < 25; q++) sums[Math.floor(q / 5)] += r.a[q];
      if (r.a[25] >= 9) p++; else if (r.a[25] <= 6) dt++;
    });
    return { n:m, dimAvg: sums.map(function(s){ return m ? s / (5 * m) : 0; }), nps: m ? Math.round((p - dt) / m * 100) : 0 };
  }
  var groups = {
    si: agg(rows.filter(function(r){ return r.tn === "si"; })),
    no: agg(rows.filter(function(r){ return r.tn === "no"; })),
    na: agg(rows.filter(function(r){ return r.tn === "na"; }))
  };
  function sd(list){
    if (list.length < 2) return null;
    var m = 0; list.forEach(function(v){ m += v; }); m /= list.length;
    var s = 0; list.forEach(function(v){ s += (v - m) * (v - m); });
    return Math.sqrt(s / (list.length - 1));
  }
  var sdOverall = sd(rows.map(function(r){ var s = 0; for (var q = 0; q < 25; q++) s += r.a[q]; return s / 25; }));
  var sdDim = DIMS.map(function(_, d){ return sd(rows.map(function(r){ var s = 0; for (var q = d*5; q < d*5+5; q++) s += r.a[q]; return s / 5; })); });
  return { n:n, dist:dist, avg:avg, dimAvg:dimAvg, overall:overall, favAll:favAll, nps:nps, det:det, pas:pas, pro:pro, texts:texts, last:last, groups:groups, sdOverall:sdOverall, sdDim:sdDim };
}

function benchBlock(st){
  var MIN = -40, MAX = 70, span = MAX - MIN;
  function pos(v){ return ((v - MIN) / span * 100); }
  function row(o){
    var tr = h("div", { class:"btrack", role:"img", "aria-label": o.nm + ": " + (o.lo !== undefined ? "de " + o.lo + " a " + o.hi : (o.v > 0 ? "+" : "") + o.v) }, h("i", { class:"zero", style:"left:" + pos(0) + "%" }));
    var bar = h("i", { class:"bar" + (o.lo !== undefined ? " range" : "") });
    if (o.lo !== undefined) { bar.style.left = pos(o.lo) + "%"; bar.style.width = (pos(o.hi) - pos(o.lo)) + "%"; }
    else { bar.style.left = pos(Math.min(0, o.v)) + "%"; bar.style.width = (Math.abs(o.v) / span * 100) + "%"; }
    tr.append(bar);
    return h("div", { class:"brow" + (o.me ? " me" : "") + (o.old ? " old" : "") },
      h("div", { class:"nm" }, o.nm, o.note ? h("small", { text:o.note }) : null),
      tr,
      h("span", { class:"v", text: o.lo !== undefined ? o.lo + " a " + o.hi : (o.v > 0 ? "+" : "") + o.v }));
  }
  var rows = [{ nm:"Tu equipo · ahora", note:"Banda: " + enpsBand(st.nps) + " · " + st.n + " " + plural(st.n, "persona", "personas"), v:st.nps, me:true }];
  if (S.compare) rows.push({ nm:"Tu equipo · encuesta anterior", note:"Banda: " + enpsBand(PREV.nps) + " · " + PREV.n + " personas", v:PREV.nps, me:true, old:true });
  var all = rows.concat(BENCH);
  var list = h("div", { class:"bench" }, all.map(row),
    h("div", { class:"bands", "aria-hidden":"true" },
      h("span", { style:"flex:" + (10 - MIN), text:"Baja" }), h("span", { style:"flex:20", text:"Estable" }), h("span", { style:"flex:20", text:"Buena" }), h("span", { style:"flex:" + (MAX - 50), text:"Excelente" })));
  return h("section", { class:"block", id:"bench-block" },
    h("h2", { text:"Tu eNPS frente a otras empresas" }),
    h("p", { class:"sub", text:"El eNPS es el mismo índice de recomendación de arriba. Las bandas son las del informe anterior: 10 o menos baja, de 10 a 30 estable, de 30 a 50 buena, 50 o más excelente." }),
    list,
    h("p", { class:"note", text:"No encontré eNPS publicados específicos de áreas de innovación o I+D. Las referencias más cercanas son empresas y sectores de tecnología. Úsalas como orientación, no como meta: miden poblaciones y métodos distintos, y en un equipo pequeño una sola persona mueve el NPS unos 4 o 5 puntos." }),
    h("p", { class:"srcs" }, "Fuentes, consultadas el 20 de noviembre de 2026: empresas, valoraciones públicas de empleados en ",
      h("a", { href:"https://www.comparably.com/companies/google/enps", target:"_blank", rel:"noopener", text:"Comparably (Google)" }), ", ",
      h("a", { href:"https://www.comparably.com/companies/microsoft/enps", target:"_blank", rel:"noopener", text:"Microsoft" }), " y ",
      h("a", { href:"https://www.comparably.com/companies/spotify/enps", target:"_blank", rel:"noopener", text:"Spotify" }),
      "; medianas por sector, ",
      h("a", { href:"https://feedbackpulse.com/resources/enps-benchmarks", target:"_blank", rel:"noopener", text:"FeedbackPulse, enero de 2026" }),
      "; rango de tecnología, ",
      h("a", { href:"https://matterapp.com/blog/enps-score", target:"_blank", rel:"noopener", text:"guía de Matter" }), "."));
}

function commentsBlock(st){
  var box = h("section", { class:"block" },
    h("h2", { text:"Comentarios del equipo" }),
    h("p", { class:"sub", text:"Pregunta abierta, sin nombres. " + (st.texts.length ? st.texts.length + " " + plural(st.texts.length, "comentario", "comentarios") + ", los más recientes primero." : "Todavía no hay comentarios.") }),
    h("div", { style:"margin-top:10px" }));
  var list = box.lastChild;
  st.texts.forEach(function(r){
    list.append(h("div", { class:"cm" }, h("p", { text:r.t }), h("small", { "data-at":String(r.at), text: ago(r.at) })));
  });
  return box;
}

function dashView(){
  var st = S.stats;
  var state, cls = "live";
  if (S.err) { state = "Sin conexión con el servidor"; cls += " off"; }
  else if (!S.loaded) { state = "Conectando…"; }
  else { state = "Se actualiza cada 20 s"; cls += " on"; }

  var head = h("header", { class:"dh" },
    h("div", {}, h("p", { class:"kicker", text:"Panel privado · Inteligencia Colaborativa" }), h("h1", { text:"Diagnóstico de equipo IENN" })),
    h("div", { class:"dh-side" },
      h("span", { class:"pill" }, svg(ICON_LOCK), "Protegido con tu clave"),
      h("button", { type:"button", id:"cmp-toggle", class:"sw-toggle", role:"switch", "aria-checked": S.compare ? "true" : "false", onclick:function(){ setCompare(!S.compare); renderDash(); } },
        h("span", { class:"trk", "aria-hidden":"true" }), "Comparar con la encuesta anterior"),
      h("span", { class:cls, text:state }),
      h("button", { class:"btn ghost", type:"button", id:"exit-btn", onclick:function(){ stopPoll(); S.mode = "survey"; mount(surveyView()); window.scrollTo(0,0); }, text:"Salir del panel" })));

  var body;
  if (!st) {
    body = h("div", { class:"empty" }, h("h2", { text:"Leyendo respuestas…" }), h("p", { class:"lede", text:"En unos segundos aparece el conteo." }));
  } else {
    var n = st.n;
    var hero = h("div", { class:"hero" },
      h("div", {},
        h("div", { class:"count" }, h("b", { text:String(n) }), h("span", { text: plural(n, "persona ha respondido", "personas han respondido") })),
        n ? h("p", { class:"since" }, "Última respuesta ", h("span", { "data-at":String(st.last), text: st.last ? ago(st.last) : "—" })) : null),
      n ? h("div", { class:"minis" },
        h("div", { class:"mini" }, h("small", { text:"Promedio general" }), h("b", { text:f1(st.overall) }), h("em", { text:"de 5" }),
          S.compare ? h("div", { class:"mprev" }, dchipAvg(st.overall, PREV.overall), "antes " + f1(PREV.overall)) : null),
        h("div", { class:"mini" }, h("small", { text:"Dispersión" }), h("b", { text:fsd(st.sdOverall) }), h("em", { text:spread(st.sdOverall) })),
        h("div", { class:"mini" }, h("small", { text:"NPS" }), h("b", { text:(st.nps > 0 ? "+" : "") + st.nps }),
          S.compare ? h("div", { class:"mprev" }, dchip(st.nps - PREV.nps, STABLE_NPS, 0), "antes " + (PREV.nps > 0 ? "+" : "") + PREV.nps) : null)) : null);
    if (!n) {
      body = h("div", {}, hero, h("div", { class:"empty" },
        h("h2", { text:"Todavía nadie ha respondido" }),
        h("p", { class:"lede", text:"Comparte el enlace de la encuesta con tu equipo. Las respuestas nuevas aparecen aquí solas, en menos de 20 segundos." })));
    } else {
      var rk = rankings(st);
      body = h("div", {}, hero, summaryBlock(st, rk), S.compare ? compareBlock(st) : null, opportunityBlock(st, rk), tenureBlock(st), detailBlock(st, rk), npsBlock(st), benchBlock(st), commentsBlock(st),
        h("p", { class:"foot", text:"Esta página se actualiza sola cada 20 segundos. Las respuestas se muestran sin nombres y también quedan en tu hoja de Google Sheets." }));
    }
  }
  var note = null;
  if (S.err) note = h("p", { class:"note", text:"No se pudieron leer las respuestas (" + S.err + "). Se vuelve a intentar solo cada 20 segundos." });

  return h("div", { class:"wrap wide" }, head, h("div", { class:"rule" }), note, body);
}

function renderDash(){
  var ae = document.activeElement && document.activeElement.id;
  var y = window.scrollY;
  mount(dashView());
  if (ae) { var el = document.getElementById(ae); if (el && el.focus) el.focus({ preventScroll:true }); }
  window.scrollTo(0, y);
}

function rowsToDocs(rows){
  return rows.map(function(r){ return { data:function(){ return r; } }; });
}

function stopPoll(){ if (S.poll) { clearInterval(S.poll); S.poll = null; } }

function refresh(){
  callApi({ action:"results", key:ctx.key }).then(function(res){
    if (!res || !res.ok) { var e = new Error("api"); e.code = (res && res.error) || "error"; throw e; }
    S.stats = computeStats(rowsToDocs(res.rows || []));
    S.loaded = true; S.err = "";
    if (S.mode === "dash") renderDash();
  }).catch(function(err){
    if (err && err.code === "key") {
      stopPoll(); ctx.key = "";
      try { sessionStorage.removeItem(KEY_KEY); } catch(e){}
      showKeyScreen("La clave no es correcta.");
      return;
    }
    S.err = (err && err.code && err.code !== "api") ? err.code : "sin conexión";
    if (S.mode === "dash") renderDash();
  });
}

function showDash(){
  S.mode = "dash";
  S.loaded = !!S.stats; S.err = "";
  renderDash();
  window.scrollTo(0, 0);
  stopPoll();
  refresh();
  S.poll = setInterval(function(){ if (!document.hidden) refresh(); }, 20000);
}

function showKeyScreen(msg){
  S.mode = "key";
  var input = h("input", { class:"keyin", id:"key-input", type:"password", autocomplete:"off", "aria-label":"Clave del panel", placeholder:"Clave del panel" });
  var err = h("p", { class:"status", role:"alert", text: msg || "" });
  var btn = h("button", { class:"btn", type:"submit", id:"key-btn", text:"Entrar" });
  var form = h("form", { class:"keyform" }, input, btn);
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var k = input.value.trim();
    if (!k) { err.textContent = "Escribe la clave."; return; }
    if (!API_URL) { err.textContent = "La encuesta todavía no está conectada a su hoja de resultados."; return; }
    btn.disabled = true; btn.textContent = "Comprobando…"; err.textContent = "";
    callApi({ action:"results", key:k }).then(function(res){
      if (res && res.ok) {
        ctx.key = k;
        try { sessionStorage.setItem(KEY_KEY, k); } catch(e){}
        S.stats = computeStats(rowsToDocs(res.rows || []));
        showDash();
        return;
      }
      btn.disabled = false; btn.textContent = "Entrar";
      err.textContent = (res && res.error === "key") ? "La clave no es correcta." : "No se pudo abrir el panel. Revisa la configuración del script.";
    }, function(){
      btn.disabled = false; btn.textContent = "Entrar";
      err.textContent = "No se pudo conectar. Revisa tu conexión.";
    });
  });
  mount(h("div", { class:"wrap" },
    h("p", { class:"kicker", text:"Panel privado · Inteligencia Colaborativa" }),
    h("h1", { text:"Resultados del diagnóstico" }),
    h("div", { class:"rule", style:"margin-top:18px;max-width:120px" }),
    h("p", { class:"lede", text:"Escribe tu clave para ver los resultados." }),
    form, err,
    h("p", { class:"req" }, h("button", { class:"linkbtn", type:"button", id:"back-btn", onclick:function(){ S.mode = "survey"; showSurvey(); window.scrollTo(0,0); }, text:"Volver a la encuesta" }))
  ));
  window.scrollTo(0,0);
  input.focus();
}

function openPanel(){
  var k = "";
  try { k = sessionStorage.getItem(KEY_KEY) || ""; } catch(e){}
  if (k && API_URL) { ctx.key = k; showDash(); return; }
  showKeyScreen("");
}

/* ---------- arranque ---------- */
(function boot(){
  setInterval(function(){
    var nodes = document.querySelectorAll("[data-at]");
    for (var i = 0; i < nodes.length; i++) { var t = parseInt(nodes[i].getAttribute("data-at"), 10); if (t) nodes[i].textContent = ago(t); }
  }, 30000);
  if (location.hash === "#panel") openPanel(); else showSurvey();
})();
})();
</script>
</body>
</html>
